    <meta charset="UTF-8" />

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KLNBMN45"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <main class="container">
      <a class="wiki-link" href="../">위키 ↗</a>
      <h1>적립금 배분 계산기</h1>
      <section class="panel" aria-labelledby="total-label">
        <label id="total-label" for="total">월 적립금</label>
        <div class="amount-input">
          <input
            id="total"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="0"
            aria-describedby="total-error"
          /><span>원</span>
        </div>
        <p id="total-error" class="field-error" role="status"></p>
      </section>
      <section class="panel summary" aria-label="계산 결과">
        <dl>
          <div>
            <dt>매수금액</dt>
            <dd id="spent">—</dd>
          </div>
          <div>
            <dt>잔액</dt>
            <dd id="remaining">—</dd>
          </div>
          <div>
            <dt>비중 합계</dt>
            <dd><span id="weight-sum">100%</span></dd>
          </div>
        </dl>
        <div
          id="allocation-bar"
          class="allocation-bar"
          role="img"
          aria-label="종목별 배분 비중"
        ></div>
        <p id="calculation-note" class="calculation-note" role="status"></p>
      </section>
      <section class="panel assets" aria-labelledby="assets-title">
        <h2 id="assets-title">종목별 배분</h2>
        <div id="rows"></div>
        <button id="add-row" class="action full" type="button">
          ＋ 종목 추가
        </button>
      </section>
      <section class="panel utilities" aria-label="설정 관리">
        <div class="utility-buttons">
          <button id="export-settings" class="outline" type="button">
            ↓ 내보내기</button
          ><button id="import-settings" class="outline" type="button">
            ↑ 불러오기
          </button>
        </div>
        <input
          id="settings-file"
          type="file"
          accept="application/json,.json"
          hidden
        />
        <button id="reset" class="action full" type="button">초기화</button>
        <p id="storage-notice" class="field-error" role="status"></p>
      </section>
      <footer>
        <span id="save-status">자동 저장</span> · 수수료·세금 미포함
      </footer>
    </main>
  </body>
</html>
